name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  doc-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 说明：本仓无 Python 依赖文件（仅标准库脚本），故不启用 setup-python 的
      # cache: pip（无依赖清单时缓存键无法生成，会直接报错）。
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint (ruff, baseline E4/E7/E9/F)
        run: |
          pip install ruff
          python -m ruff check .

      - name: Documentation consistency check (relative links / UTF-8 / doc count)
        run: python tools/doc_check.py
